<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orders Grid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
  body {
    background-color: #000000;
    color: #C49C74;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  .order-card {
    background: #0f0f0f;
    border: 2px solid #C49C74;
    box-shadow: 0 0 15px #C49C7480;
    border-radius: 13px;
    padding: 1.2rem;
    margin-bottom: 1.5rem;
    transition: 0.3s ease-in-out;
  }

  .order-card:hover {
    box-shadow: 0 0 25px #C49C74;
  }

  .order-title {
    font-size: 1.3rem;
    font-weight: bold;
    color: #C49C74;
    margin-bottom: 1rem;
  }

  .item-box {
    background: #121212;
    border-left: 5px solid #C49C74;
    padding: 0.6rem 1rem;
    margin-bottom: 0.6rem;
    border-radius: 6px;
    box-shadow: 0 0 6px #C49C7466;
    color: #f0e9dc;
  }

  .item-box.urgent {
    border-left-color: #DC090D;
    box-shadow: 0 0 6px #DC090D55;
    color: #ffeaea;
  }

  h1.page-title {
    color: #C49C74;
    text-shadow: 0 0 10px #C49C7488;
    margin-bottom: 2rem;
  }

  .table {
    color: #e8e8e8;
  }

  .table thead th {
    background-color: #1a1a1a;
    color: #C49C74;
    border-bottom: 1px solid #C49C74;
  }

  .table-striped tbody tr:nth-of-type(odd) {
    background-color: #111111;
  }

  .table-striped tbody tr:nth-of-type(even) {
    background-color: #1a1a1a;
  }

  .table td,
  .table th {
    border-color: #2a2a2a;
  }

  .table-active {
    background-color: #1a1a1a !important;
    color: #C49C74;
  }

  .table-success {
    background-color: #1c1c1c !important;
    color: #C49C74;
  }

  .table-danger {
    background-color: #330000 !important;
    color: #ffcccc;
  }

  .mark-as-done-api {
    background-color: #C49C74;
    color: #000000;
    font-size: 11px;
    padding: 5px 10px;
    border: none;
    border-radius: 5px;
    margin-top: 10px;
    transition: background-color 0.2s;
  }

  .mark-as-done-api:hover {
    background-color: #a8865f;
    color: #fff;
  }

  @media (max-width: 767px) {
    .order-title {
      text-align: center;
    }
  }
</style>
</head>
<body>
  <div class="py-3 container-fluid">
    <h1 class="text-center page-title">Kitchen Orders Board</h1>

    <div class="row g-3 orders">

    </div>
  </div>


<script src='assets/jquery/jquery.min.js'></script>
<script src='assets/pollinator/pollinator.min.js'></script>
<script src='assets/pollinator/polly.js'></script>
<script>
    $(document).ready(function () {

    // usage

    const polling = new PollingManager({
        url: `/orders-api`, // API to fetch data
        delay: 5000, // Poll every 5 seconds
        failRetryCount: 3, // Retry on failure
        onSuccess: (res) => {
            $('.orders').html('');
            res.forEach(order => {
                let itemsHTML = `
                    <table class="table mb-0 table-sm table-striped">
                        <thead class="table-light">
                            <tr>
                                <th>Qty</th>
                                <th>Code</th>
                                <th>Product</th>
                                <th>Price</th>
                                <th>Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                order.items.forEach(item => {
                    let urgentClass = item.is_urgent ? 'table-danger' : '';
                    itemsHTML += `
                        <tr class="${urgentClass}">
                            <td>
                                <b class="text-danger">${item.quantity}</b>
                            </td>
                            <td><b>${item.product_id}</b></td>
                            <td>${item.product_name}</td>
                            <td>₱${item.total}</td>
                            <td>₱${item.subtotal}</td>
                        </tr>
                    `;
                });

                const formatMoney = (amount) => {
                    return new Intl.NumberFormat('en-PH', {
                        style: 'currency',
                        currency: 'PHP',
                        minimumFractionDigits: 2
                    }).format(amount);
                };

                const formatDate = (dateStr) => {
                    const date = new Date(dateStr);
                    return date.toLocaleString('en-PH', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric',
                        hour: 'numeric',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: true
                    });
                };

                const diffTimer = (startTime, elementId) => {
                    const start = new Date(startTime);

                    const updateTimer = () => {
                        const now = new Date();
                        const diffMs = now - start;
                        const mins = Math.floor(diffMs / 60000);
                        const secs = Math.floor((diffMs % 60000) / 1000);
                        document.getElementById(elementId).textContent = `${mins}m ${secs}s`;
                    };

                    updateTimer();
                    return setInterval(updateTimer, 1000);
                };

                // Inside your $.get success:
                order.items.forEach(item => {
                    // existing rows...
                });

                const readableSentTime = formatDate(order.sent_to_kitchen_at);
                const timerId = `timer-${order.id}`;

                itemsHTML += `
                    <tr class="table-active fw-bold">
                        <td colspan="4" class="text-end">Sent to kitchen:</td>
                        <td>
                            ${readableSentTime}<br>
                            <small>⏱ <span id="${timerId}"></span></small>
                        </td>
                    </tr>
                    <tr class="table-active fw-bold">
                        <td colspan="4" class="text-end">Total:</td>
                        <td>${formatMoney(order.total)}</td>
                    </tr>
                    <tr class="table-active fw-bold">
                        <td colspan="4" class="text-end">Discount:</td>
                        <td>${order.discount}%</td>
                    </tr>
                    <tr class="table-success fw-bold">
                        <td colspan="4" class="text-end">Discounted Price:</td>
                        <td>${formatMoney(order.discounted_price)}</td>
                    </tr>
                    </tbody>
                </table>

                <button style="font-size: 10px; margin-top: 10px;" class="mark-as-done-api" data-id="${order.id}">Mark As Done</button>
                `;

                setTimeout(() => diffTimer(order.sent_to_kitchen_at, timerId), 100); // slight delay to ensure DOM element exists

                $('.orders').prepend(`
                    <div class="mb-4 col-md-6 col-lg-4">
                        <div class="p-3 rounded shadow-sm order-card">
                            <div class="mb-2 order-title fw-bold">Table #${order.table_number}</div>
                            ${itemsHTML}
                        </div>
                    </div>
                `);
            });

            $('.mark-as-done-api').click(function () {
                let dataId = $(this).attr('data-id');
                $.get('/mark-as-done-api/' + dataId, function (res) {
                    console.log(res);
                }).fail(err => {
                    console.log(err);
                })
            })
        },
        onError: (error) => {
            console.error("Error fetching data:", error);
            // Your custom error handling logic
        }
    });

    // Start polling
    polling.start();
    // $.get('/orders-api', function (res) {
    //     console.log(res)

    // }).fail(err => {
    //     console.log(err)
    // });

    // setInterval(() => {
    //     window.location.reload();
    // }, 10000);
});

</script>

</body>
</html>
